<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Milla, tu es invitée</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;1,6..96,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Pinyon+Script&display=swap" rel="stylesheet">
<style>
:root{
  --outside:#EADDE0;
  --paper:#FDF9F8;
  --paper-2:#F8EFEF;
  --door:#F6F0F3;
  --ink:#37503F;
  --text:#4A4446;
  --muted:#8E7F82;
  --rose:#EDB6C0;
  --rose-2:#D48D9B;
  --rose-3:#A95466;
  --gold:#C9A07E;
  --line:rgba(169,84,102,.22);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --outside:#2A2226; } }
:root[data-theme="dark"]{ --outside:#2A2226; }

*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;background:var(--outside);color:var(--text);
  font-family:"Cormorant Garamond",Garamond,"Times New Roman",serif;font-size:19px;line-height:1.6;
  -webkit-tap-highlight-color:transparent;
}
body.locked{overflow:hidden;height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--rose-3);outline-offset:4px}
svg{display:block}

/* ---------- colonne papier ---------- */
.book{
  position:relative;max-width:480px;margin:0 auto;background:var(--paper);min-height:100svh;overflow:hidden;
  box-shadow:0 0 60px rgba(90,40,55,.12);
}
.grain::after{
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.35;mix-blend-mode:multiply;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .55  0 0 0 0 .45  0 0 0 0 .47  0 0 0 .09 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");
}

/* ---------- portes ---------- */
.gate{position:fixed;inset:0;z-index:50;display:flex;justify-content:center;transition:opacity .8s ease .9s}
.gate.gone{opacity:0;pointer-events:none}
.gate-inner{position:relative;width:100%;max-width:480px;height:100%;overflow:hidden}
.door{
  position:absolute;top:0;bottom:0;width:50%;overflow:hidden;
  background:linear-gradient(170deg,#F6F1EF 0%,#F1E9E7 55%,#ECE2E0 100%);
  transition:transform 1.7s cubic-bezier(.7,0,.2,1) .45s;
}
.door.l{left:0;box-shadow:inset -1px 0 0 rgba(150,110,115,.28), inset -14px 0 22px -16px rgba(90,50,60,.35)}
.door.r{right:0;box-shadow:inset 1px 0 0 rgba(255,255,255,.9), inset 14px 0 22px -16px rgba(90,50,60,.35)}
.door > svg:not(.seal-half){position:absolute;inset:0;width:100%;height:100%}
.door::before{
  content:"";position:absolute;inset:-20% -60%;z-index:2;pointer-events:none;
  background:linear-gradient(105deg,transparent 42%,rgba(255,255,255,.6) 50%,transparent 58%);
  transform:translateX(-70%);animation:sheen 3.4s cubic-bezier(.4,0,.2,1) .5s 1 forwards;
}
.door.r::before{animation-delay:.75s}
@keyframes sheen{to{transform:translateX(70%)}}
.gate.open .door.l{transform:translateX(-101%)}
.gate.open .door.r{transform:translateX(101%)}

.foil{position:absolute;top:12%;width:200%;text-align:center;z-index:3;pointer-events:none;
  font-family:"Bodoni Moda",Didot,serif;font-size:11px;letter-spacing:.5em;text-indent:.5em;text-transform:uppercase;
  background:linear-gradient(100deg,#A97F5C 0%,#E9CFB2 28%,#B98E6A 48%,#F3E0C9 66%,#A87E5B 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.foil b{display:block;font-family:"Pinyon Script",cursive;font-weight:400;font-size:50px;letter-spacing:0;text-indent:0;text-transform:none;line-height:1.3;margin-top:4px}
.foil.bottom{top:auto;bottom:calc(4.5% + env(safe-area-inset-bottom,0px))}
.door.l .foil{left:0}.door.r .foil{right:0}

.ribbon{
  position:absolute;left:0;right:0;top:61%;height:13px;margin-top:-6.5px;z-index:3;
  background:linear-gradient(180deg,#C9A2A8 0%,#EDD6D9 35%,#D9B6BB 62%,#BF959B 100%);
  box-shadow:0 2px 5px rgba(90,40,55,.18);
}
.seal-half{position:absolute;top:61%;width:92px;height:92px;margin-top:-46px;z-index:4;
  filter:drop-shadow(0 4px 6px rgba(70,20,35,.35));transition:transform 1.2s cubic-bezier(.6,0,.3,1) .35s}
.door.l .seal-half{right:-46px}.door.r .seal-half{left:-46px}
.gate.open .door.l .seal-half{transform:rotate(-9deg) translateY(4px)}
.gate.open .door.r .seal-half{transform:rotate(7deg) translateY(-2px)}

.seal-btn{position:absolute;left:50%;top:61%;width:110px;height:110px;margin:-55px 0 0 -55px;z-index:6;
  border:0;border-radius:50%;background:none;cursor:pointer;padding:0}
.gate-hint{position:absolute;left:0;right:0;top:calc(61% + 60px);z-index:5;text-align:center;margin:0;pointer-events:none;
  font-family:"Bodoni Moda",serif;font-size:10.5px;letter-spacing:.42em;text-indent:.42em;text-transform:uppercase;color:#9C7F76;
  animation:breathe 2.8s ease-in-out infinite;transition:opacity .3s}
@keyframes breathe{0%,100%{opacity:.45}50%{opacity:1}}
.gate.open .gate-hint{opacity:0;animation:none}

/* ---------- hero ---------- */
.hero{position:relative;height:100svh;min-height:600px;display:flex;align-items:center;justify-content:center;background:var(--paper-2)}
.hero > svg{width:100%;height:100%}
.hero .t{opacity:0;transform:translateY(10px);transform-box:fill-box;transform-origin:center;transition:opacity 1.2s ease, transform 1.2s cubic-bezier(.2,.7,.2,1)}
.revealed .hero .t{opacity:1;transform:none}
.revealed .hero .t2{transition-delay:.35s}
.revealed .hero .t3{transition-delay:.7s}
.revealed .hero .t4{transition-delay:1.05s}
.scroll-cue{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0px));left:50%;width:1px;height:34px;background:linear-gradient(var(--rose-2),transparent);opacity:0;transition:opacity 1s 1.8s}
.revealed .scroll-cue{opacity:.8}

/* ---------- sections ---------- */
section.block{position:relative;padding:64px 28px;text-align:center}
.divider{width:220px;height:44px;margin:0 auto}
.script{font-family:"Pinyon Script",cursive;font-weight:400;color:var(--rose-3);font-size:38px;line-height:1.15;margin:0}
.display{font-family:"Bodoni Moda",Didot,"Times New Roman",serif;font-weight:400;color:var(--ink);font-size:36px;line-height:1.15;margin:0 0 6px}
.caps{font-family:"Bodoni Moda",serif;font-size:12px;letter-spacing:.34em;color:var(--muted);text-transform:uppercase;margin:0}
.lead{max-width:30ch;margin:14px auto 0;font-size:20px}

.countdown{display:flex;justify-content:center;margin:26px auto 0;max-width:360px}
.countdown div{flex:1}
.countdown div + div{border-left:1px solid var(--line)}
.countdown b{display:block;font-family:"Bodoni Moda",serif;font-weight:400;font-size:40px;line-height:1.1;color:var(--ink);font-variant-numeric:lining-nums tabular-nums}
.countdown small{display:block;margin-top:4px;font-size:11px;letter-spacing:.28em;text-transform:uppercase;color:var(--muted)}
.countdown-done{font-family:"Pinyon Script",cursive;font-size:40px;color:var(--rose-3);margin:18px 0 0}

/* médaillon à gratter */
.cameo{position:relative;width:min(78%,300px);aspect-ratio:300/370;margin:30px auto 0}
.cameo > svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.cameo-win{position:absolute;left:14%;right:14%;top:12%;bottom:12%;border-radius:50%;overflow:hidden;box-shadow:inset 0 0 0 1px var(--line),0 4px 14px rgba(120,60,80,.18);z-index:1}
.cameo-win img{width:100%;height:100%;object-fit:cover;object-position:50% 36%;display:block}
.cameo canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:grab;transition:opacity 1s ease}
.cameo canvas.done{opacity:0;pointer-events:none}
.scratch-hint{margin:14px 0 0;font-style:italic;color:var(--muted);min-height:1.6em;transition:opacity .5s}

/* scène de la soirée */
.scene-ill{width:100%;max-width:360px;margin:18px auto 0}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flicker 1.8s ease-in-out infinite}
.glow{animation:glow 1.8s ease-in-out infinite}
@keyframes flicker{0%,100%{transform:scale(1,1) skewX(0)}30%{transform:scale(.92,1.08) skewX(3deg)}60%{transform:scale(1.04,.95) skewX(-2deg)}}
@keyframes glow{0%,100%{opacity:.55}50%{opacity:.8}}
.facts{margin:22px auto 0;max-width:320px}
.fact{padding:14px 0}
.fact + .fact{border-top:1px solid var(--line)}
.fact .caps{margin-bottom:4px}
.fact .v{font-family:"Bodoni Moda",serif;font-size:24px;color:var(--ink);line-height:1.25}
.fact .s{display:block;font-style:italic;color:var(--muted)}

/* programme */
.timeline{list-style:none;margin:26px auto 0;padding:0;max-width:330px;text-align:left}
.timeline li{display:grid;grid-template-columns:44px 74px 1fr;align-items:center;gap:6px;padding:12px 0}
.timeline li + li{border-top:1px dashed var(--line)}
.timeline svg{width:34px;height:34px;color:var(--rose-2)}
.timeline .time{font-family:"Bodoni Moda",serif;font-size:17px;color:var(--ink)}
.timeline .what{font-size:19px;line-height:1.3}
.timeline .what small{display:block;font-style:italic;color:var(--muted);font-size:16px}

/* mot */
.letter{max-width:32ch;margin:20px auto 0;font-size:21px;font-style:italic;line-height:1.7}
.sign{font-family:"Pinyon Script",cursive;font-size:44px;color:var(--ink);margin:14px 0 0}

/* réponse */
.rsvp-btn{
  margin:28px auto 0;display:inline-block;padding:15px 34px;border-radius:999px;cursor:pointer;
  border:1px solid var(--rose-3);background:var(--rose-3);color:#fff;font-size:19px;letter-spacing:.06em;
  box-shadow:0 8px 20px rgba(169,84,102,.28);transition:transform .2s, box-shadow .2s;
}
.rsvp-btn:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(169,84,102,.34)}
.rsvp-done{display:none;flex-direction:column;align-items:center;margin-top:26px}
.is-accepted .rsvp-btn{display:none}
.is-accepted .rsvp-done{display:flex}
.wax{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;
  background:radial-gradient(circle at 36% 30%,#C4677A 0%,#9E4257 55%,#6F2638 100%);
  box-shadow:inset 0 0 0 6px rgba(0,0,0,.08),inset 0 0 0 9px rgba(255,255,255,.07),0 5px 10px rgba(100,30,50,.35);
  font-family:"Pinyon Script",cursive;font-size:38px;color:#7C2C3F;text-shadow:1px 1px 0 rgba(255,255,255,.22),-1px -1px 0 rgba(0,0,0,.22);
  animation:stamp .6s cubic-bezier(.3,1.6,.5,1)}
.wax span{transform:translateY(3px)}
.rsvp-done p{margin:12px 0 0;font-style:italic;font-size:20px}
@keyframes stamp{from{transform:scale(2) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
.footer-bow{width:120px;margin:40px auto 0}

#petals{position:fixed;inset:0;pointer-events:none;z-index:40}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none!important;transition-duration:.01ms!important;transition-delay:0s!important}
}
</style>
</head>
<body class="locked">

<!-- ================= Les portes ================= -->
<div class="gate" id="gate">
  <div class="gate-inner">
    <div class="door l grain">
      <svg id="doorL" viewBox="0 0 200 700" preserveAspectRatio="xMaxYMid slice" aria-hidden="true"></svg>
      <div class="foil" aria-hidden="true">pour<b>Milla</b></div>
      <div class="foil bottom" aria-hidden="true">03 · 10 · 2026</div>
      <div class="ribbon"></div>
      <svg class="seal-half" viewBox="0 0 92 92" aria-hidden="true"></svg>
    </div>
    <div class="door r grain">
      <svg id="doorR" viewBox="0 0 200 700" preserveAspectRatio="xMinYMid slice" aria-hidden="true"></svg>
      <div class="foil" aria-hidden="true">pour<b>Milla</b></div>
      <div class="foil bottom" aria-hidden="true">03 · 10 · 2026</div>
      <div class="ribbon"></div>
      <svg class="seal-half" viewBox="0 0 92 92" aria-hidden="true"></svg>
    </div>
    <button class="seal-btn" id="sealBtn" aria-label="Briser le sceau et ouvrir l'invitation"></button>
    <p class="gate-hint">Brise le sceau</p>
  </div>
</div>

<div class="book grain" id="book">

  <!-- ================= Hero ================= -->
  <header class="hero">
    <svg id="heroSvg" viewBox="0 0 400 720" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="heroTitle">
      <title id="heroTitle"></title>
    </svg>
    <div class="scroll-cue" aria-hidden="true"></div>
  </header>

  <!-- ================= Compte à rebours ================= -->
  <section class="block">
    <p class="caps">Samedi 3 octobre</p>
    <p class="script" style="margin-top:6px">Plus que</p>
    <div id="cdWrap">
      <div class="countdown" role="timer">
        <div><b id="cd-d">0</b><small>jours</small></div>
        <div><b id="cd-h">0</b><small>heures</small></div>
        <div><b id="cd-m">0</b><small>min</small></div>
        <div><b id="cd-s">0</b><small>sec</small></div>
      </div>
    </div>
  </section>

  <svg class="divider" viewBox="0 0 220 44" data-ornament="divider" aria-hidden="true"></svg>

  <!-- ================= Photo à gratter ================= -->
  <section class="block">
    <h2 class="display">Un souvenir</h2>
    <p class="caps">rien que pour toi</p>

function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
const C = { roseF:"url(#gRose)", roseS:"#D08A99", whiteF:"url(#gWhite)", whiteS:"#D2BDBD", leafF:"url(#gLeaf)", leafS:"#4F7457", hyd:"#F1BCC7", hydS:"#D48D9B", gold:"#C9A07E", vine:"#6E8F72" };

const DEFS = `
<defs>
  <radialGradient id="gRose" cx=".4" cy=".35" r=".75"><stop offset="0" stop-color="#FCE3E8"/><stop offset=".6" stop-color="#F2BDC8"/><stop offset="1" stop-color="#E29BAB"/></radialGradient>
  <radialGradient id="gWhite" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".7" stop-color="#FAF3F2"/><stop offset="1" stop-color="#EADCDB"/></radialGradient>
  <linearGradient id="gLeaf" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9CBBA0"/><stop offset=".5" stop-color="#6E9476"/><stop offset="1" stop-color="#4C7056"/></linearGradient>
  <linearGradient id="gIvy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6F9A78"/><stop offset="1" stop-color="#2F5A40"/></linearGradient>
  <linearGradient id="gGold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#E3C3A6"/><stop offset=".5" stop-color="#C39271"/><stop offset="1" stop-color="#E9CDB3"/></linearGradient>
  <filter id="emb" x="-20%" y="-20%" width="140%" height="140%">
    <feDropShadow dx=".7" dy="1" stdDeviation=".6" flood-color="#7A3A4A" flood-opacity=".32"/>
    <feDropShadow dx="-.4" dy="-.5" stdDeviation=".25" flood-color="#FFFFFF" flood-opacity=".95"/>
  </filter>
</defs>`;

function rose(x,y,s,rot=0,white=false){
  const f = white?C.whiteF:C.roseF, st = white?C.whiteS:C.roseS;
  return `<g transform="translate(${x} ${y}) rotate(${rot}) scale(${s})">
  <path d="M-10,1 C-11,-7 -4,-11.5 1,-10.5 C8,-10 11.5,-4 10.5,2 C9.5,8 3,11.5 -2,10.5 C-7.5,9.5 -10,6 -10,1Z" fill="${f}" stroke="${st}" stroke-width=".7"/>
  <path d="M-8.5,-3 C-6,-8.5 3,-9.5 7,-4" fill="none" stroke="${st}" stroke-width=".6"/>
  <path d="M-8.5,4 C-5,9.5 5,9.5 8.5,3.5" fill="none" stroke="${st}" stroke-width=".6"/>
  <path d="M-1.2,.6 a1.6,1.6 0 1,1 2.4,.5 a3,3 0 1,1 -4.6,-1.7 a4.6,4.6 0 1,1 7.3,2.5 a6.3,6.3 0 1,1 -9.8,-3.2" fill="none" stroke="${st}" stroke-width=".75" stroke-linecap="round"/>
  </g>`;
}
function leaf(x,y,l,ang){
  return `<g transform="translate(${x} ${y}) rotate(${ang})"><path d="M0,0 C${l*.3},${-l*.32} ${l*.72},${-l*.26} ${l},0 C${l*.72},${l*.26} ${l*.3},${l*.32} 0,0Z" fill="${C.leafF}" stroke="${C.leafS}" stroke-width=".5"/><path d="M${l*.05},0 L${l*.88},0" stroke="#E9F1EA" stroke-width=".5" opacity=".8"/></g>`;
}
function ivy(x,y,s,ang){
  return `<g transform="translate(${x} ${y}) rotate(${ang}) scale(${s})"><path d="M0,0 L-2,-3 L-8,-5 L-5,-8 L-6,-13 L-1.5,-10.5 L0,-15 L1.5,-10.5 L6,-13 L5,-8 L8,-5 L2,-3Z" fill="url(#gIvy)" stroke="#264A34" stroke-width=".4" stroke-linejoin="round"/><path d="M0,-1 L0,-12 M0,-4 L-5,-7 M0,-4 L5,-7" stroke="#A9C8AF" stroke-width=".35" fill="none"/></g>`;
}
function calla(x,y,s,ang){
  return `<g transform="translate(${x} ${y}) rotate(${ang}) scale(${s})"><path d="M0,0 C-1,-6 -6,-10 -5,-17 C-2,-15 4,-15 6,-19 C7,-12 3,-5 0,0Z" fill="url(#gWhite)" stroke="#CBB6B4" stroke-width=".5"/><path d="M0,-3 C.5,-8 1.5,-12 2,-14" stroke="#E7C66E" stroke-width="1.6" stroke-linecap="round"/><path d="M0,0 L0,9" stroke="${C.vine}" stroke-width="1"/></g>`;
}
function hydrangea(x,y,R,r){
  let out = `<g>`; const pts=[];
  for (let i=0;i<18;i++){ const a=r()*Math.PI*2, d=Math.sqrt(r())*R; pts.push([x+Math.cos(a)*d, y+Math.sin(a)*d*.9]); }
  pts.sort((a,b)=>a[1]-b[1]);
  const p=R*.2;
  for (const [px,py] of pts){
    const rot=r()*90;
    out += `<g transform="translate(${px.toFixed(1)} ${py.toFixed(1)}) rotate(${rot.toFixed(0)})">`;
    for (let k=0;k<4;k++){ const a=k*Math.PI/2; out += `<ellipse cx="${(Math.cos(a)*p*.8).toFixed(2)}" cy="${(Math.sin(a)*p*.8).toFixed(2)}" rx="${(p*.7).toFixed(2)}" ry="${(p*.55).toFixed(2)}" transform="rotate(${k*90} ${(Math.cos(a)*p*.8).toFixed(2)} ${(Math.sin(a)*p*.8).toFixed(2)})" fill="${C.hyd}" stroke="${C.hydS}" stroke-width=".4"/>`; }
    out += `<circle r="${(p*.22).toFixed(2)}" fill="#C46F83"/></g>`;
  }
  return out + `</g>`;
}
function pearl(x,y,rr=1.6){ return `<circle cx="${x}" cy="${y}" r="${rr}" fill="#FFFFFF" stroke="#E4D2D2" stroke-width=".4"/>`; }
function bud(x,y,s,ang){ return `<g transform="translate(${x} ${y}) rotate(${ang}) scale(${s})"><path d="M0,0 C-3,-3 -3,-8 0,-11 C3,-8 3,-3 0,0Z" fill="${C.roseF}" stroke="${C.roseS}" stroke-width=".5"/><path d="M0,1 C-3,-1 -4,-4 -3,-6 M0,1 C3,-1 4,-4 3,-6" stroke="${C.vine}" stroke-width=".8" fill="none"/></g>`; }
function curl(x,y,s,flip=1){ return `<path d="M${x},${y} c${4*s*flip},${-6*s} ${10*s*flip},${-4*s} ${9*s*flip},${2*s} c${-1*s*flip},${4*s} ${-6*s*flip},${3*s} ${-4*s*flip},${-1*s}" fill="none" stroke="${C.vine}" stroke-width=".8" stroke-linecap="round"/>`; }

/* ---------- portes : gaufrage à sec, ton sur ton ---------- */
function doorSVG(seed){
  const r = rng(seed); let g = "";
  const W=200,H=700, cx=W/2+8;
  const stem = (off,amp,ph) => { let d=`M${cx+off},${H-40}`; for(let y=H-40;y>=60;y-=10){ const x=cx+off+Math.sin(y/70+ph)*amp; d+=` L${x.toFixed(1)},${y}`; } return d; };
  g += `<path d="${stem(-8,30,0)}" fill="none" stroke="#000" stroke-width="1.4" stroke-linecap="round"/>`;
  g += `<path d="${stem(6,22,2.2)}" fill="none" stroke="#000" stroke-width="1" stroke-linecap="round"/>`;
  const X = y => cx-8+Math.sin(y/70)*30;
  for (let y=H-60;y>80;y-=30){ const x=X(y); const side=(Math.round(y/30)%2)?1:-1;
    g += leaf(x,y,15+r()*7, side>0? -30-r()*30 : 210+r()*30);
    if (r()>.5) g += ivy(x+side*13, y-6, .85+r()*.3, side*25);
  }
  for (let i=0;i<18;i++){ g += pearl((26+r()*148).toFixed(1),(60+r()*580).toFixed(1),1+r()*.8); }
  const spots = [[590,'w'],[500,'h'],[440,'c'],[330,'p'],[250,'h'],[180,'w']];
  for (const [y,k] of spots){ const x=X(y); const side=(y%2?1:-1)*(r()>.5?1:-1); const ox=x+side*(16+r()*12);
    if(k==='h'){ g += leaf(ox-10,y+14,18,160)+leaf(ox+10,y+14,18,20)+hydrangea(ox,y,17,r); }
    if(k==='w'){ g += leaf(x-16,y+8,18,170)+leaf(x+12,y+10,18,15)+rose(x-4,y,1.8,r()*40,true)+bud(x-22,y-18,1,-30); }
    if(k==='p'){ g += rose(ox,y,1.4,r()*60,true)+leaf(ox-12,y+11,15,150)+bud(ox+14,y-13,1,30); }
    if(k==='c'){ g += calla(ox,y+12,1.3,side*20)+calla(ox+side*9,y+18,1,side*35); }
  }
  g = g.replace(/fill="(?!none)[^"]*"/g,'fill="#F2EAE8"').replace(/stroke="[^"]*"/g,'stroke="#DCCBC9"');
  const frame = `<rect x="11" y="11" width="178" height="678" rx="2" fill="none" stroke="url(#gFoil)" stroke-width=".9"/>
    <rect x="16" y="16" width="168" height="668" rx="1.5" fill="none" stroke="url(#gFoil)" stroke-width=".45"/>`;
  return `<defs>
    <linearGradient id="gFoil" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#B38A67"/><stop offset=".3" stop-color="#EBD2B6"/><stop offset=".55" stop-color="#B98E6A"/><stop offset=".8" stop-color="#F1DEC6"/><stop offset="1" stop-color="#A97F5C"/></linearGradient>
    <filter id="blind" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx=".9" dy="1.1" stdDeviation=".8" flood-color="#7E5D63" flood-opacity=".30"/>
      <feDropShadow dx="-.7" dy="-.8" stdDeviation=".35" flood-color="#FFFFFF" flood-opacity="1"/>
    </filter></defs>` + `<g filter="url(#blind)">${g}</g>` + frame;
}
document.getElementById("doorL").innerHTML = doorSVG(7);
document.getElementById("doorR").innerHTML = `<g transform="translate(200 0) scale(-1 1)">${doorSVG(7)}</g>`;

/* ---------- sceau de cire, coupé en deux par l'ouverture ---------- */
(function(){
  const r = rng(12); const pts=[]; const N=22;
  for(let i=0;i<N;i++){ const a=i/N*Math.PI*2, rad=40+(r()-.5)*4.5; pts.push([46+Math.cos(a)*rad, 46+Math.sin(a)*rad]); }
  let d=`M${((pts[0][0]+pts[1][0])/2).toFixed(1)},${((pts[0][1]+pts[1][1])/2).toFixed(1)}`;
  for(let i=1;i<=N;i++){ const p=pts[i%N], q=pts[(i+1)%N]; d+=` Q${p[0].toFixed(1)},${p[1].toFixed(1)} ${((p[0]+q[0])/2).toFixed(1)},${((p[1]+q[1])/2).toFixed(1)}`; }
  const svg = `<defs>
    <radialGradient id="wax" cx=".38" cy=".32" r=".75"><stop offset="0" stop-color="#B85B70"/><stop offset=".55" stop-color="#8E3148"/><stop offset="1" stop-color="#5E1A2C"/></radialGradient>
    <radialGradient id="wax2" cx=".6" cy=".7" r=".7"><stop offset="0" stop-color="#7A2439"/><stop offset="1" stop-color="#9A3A51"/></radialGradient>
    <filter id="waxEmb"><feDropShadow dx=".8" dy="1" stdDeviation=".5" flood-color="#3A0C18" flood-opacity=".7"/><feDropShadow dx="-.6" dy="-.7" stdDeviation=".4" flood-color="#E79AAA" flood-opacity=".55"/></filter></defs>
    <path d="${d}Z" fill="url(#wax)"/>
    <circle cx="46" cy="46" r="29" fill="url(#wax2)" filter="url(#waxEmb)"/>
    <circle cx="46" cy="46" r="25.5" fill="none" stroke="#6E2034" stroke-width=".8" opacity=".7"/>
    <g filter="url(#waxEmb)" fill="none" stroke="#A8475E" stroke-width=".8">
      <path d="M31,60 C36,56 40,57 43,60 M61,60 C56,56 52,57 49,60"/>
    </g>
    <text x="46" y="56" text-anchor="middle" font-family="Bodoni Moda, Didot, serif" font-size="28" fill="#7C2438" filter="url(#waxEmb)">${initial}</text>
    <ellipse cx="33" cy="27" rx="9" ry="4" fill="#fff" opacity=".13" transform="rotate(-30 33 27)"/>`;
  document.querySelectorAll(".seal-half").forEach(s => s.innerHTML = svg);
})();

/* ---------- hero : cadre art nouveau ---------- */
function heroSVG(){
  const r = rng(31); let g = "";
  const cx=200, cy=372, rx=122, ry=184;
  // fond du médaillon
  g += `<ellipse cx="${cx}" cy="${cy}" rx="${rx+18}" ry="${ry+18}" fill="#FBEFF1"/>`;
  // entrelacs art nouveau (miroir)
  const side = (m) => {
    const t = (x)=> m? 400-x : x; let s="";
    s += `<path d="M${t(64)},692 C${t(34)},600 ${t(40)},470 ${t(58)},380 C${t(76)},290 ${t(62)},200 ${t(92)},140 C${t(118)},88 ${t(160)},62 ${t(200)},56" fill="none" stroke="url(#gGold)" stroke-width="2.2"/>`;
    s += `<path d="M${t(76)},692 C${t(48)},600 ${t(54)},470 ${t(70)},382 C${t(88)},294 ${t(74)},206 ${t(102)},150 C${t(126)},102 ${t(164)},76 ${t(200)},70" fill="none" stroke="#E8C9CF" stroke-width="1.2"/>`;
    // nœuds en 8 en bas
    s += `<path d="M${t(150)},620 C${t(120)},596 ${t(100)},640 ${t(130)},656 C${t(160)},672 ${t(180)},640 ${t(200)},620" fill="none" stroke="url(#gGold)" stroke-width="2"/>`;
    s += `<path d="M${t(150)},620 C${t(170)},606 ${t(190)},604 ${t(200)},620" fill="none" stroke="url(#gGold)" stroke-width="2"/>`;
    // petites volutes en haut
    s += `<path d="M${t(128)},110 C${t(116)},128 ${t(140)},140 ${t(150)},126 C${t(158)},114 ${t(146)},104 ${t(138)},112" fill="none" stroke="url(#gGold)" stroke-width="1.4"/>`;
    return s;
  };
  g += side(false) + side(true);
  // double ovale
  g += `<ellipse cx="${cx}" cy="${cy}" rx="${rx+10}" ry="${ry+10}" fill="none" stroke="url(#gGold)" stroke-width="2.4"/>`;
  g += `<ellipse cx="${cx}" cy="${cy}" rx="${rx+4}" ry="${ry+4}" fill="none" stroke="#E4B9C2" stroke-width="1"/>`;
  g += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="#FFFBFA" stroke="#EFD6DB" stroke-width=".8"/>`;
  // bouquets
  const orn = (bx,by,flip) => { let s=""; const f=flip?-1:1;
    s += `<path d="M${bx},${by+30} C${bx+f*10},${by} ${bx+f*4},${by-40} ${bx+f*22},${by-80}" fill="none" stroke="${C.vine}" stroke-width="1.3"/>`;
    s += leaf(bx+f*6,by-10,22,f>0?-60:240); s += leaf(bx+f*12,by-44,20,f>0?-20:200); s += ivy(bx-f*14,by+8,1.3,-f*30); s += ivy(bx+f*20,by-66,1.1,f*20);
    s += calla(bx+f*22,by-74,1.5,f*15); s += calla(bx+f*10,by-38,1.2,f*30);
    s += hydrangea(bx+f*14,by+30,24,r);
    return s; };
  g += orn(52,560,false) + orn(348,560,true);
  g += orn(62,240,false) + orn(338,240,true);
  // guirlande haute
  g += leaf(160,176,24,200) + leaf(240,176,24,-20) + ivy(140,190,1.2,-40) + ivy(262,190,1.2,40);
  g += rose(176,172,1.7,20,true) + rose(224,170,1.6,-30,true) + rose(200,156,2.1,0,false) + bud(152,160,1.2,-50) + bud(248,160,1.2,50);
  // bouquet bas
  g += leaf(158,572,26,160) + leaf(242,572,26,20) + ivy(132,560,1.4,-60) + ivy(268,560,1.4,60) + ivy(170,600,1.2,-20) + ivy(230,600,1.2,20);
  g += hydrangea(168,586,20,r) + hydrangea(232,586,20,r);
  g += rose(200,572,2.4,10,true) + rose(176,560,1.5,-20,false) + rose(224,560,1.5,30,false);
  // perles le long de l'ovale
  for (let i=0;i<40;i++){ const a=i/40*Math.PI*2; g += pearl((cx+Math.cos(a)*(rx+17)).toFixed(1),(cy+Math.sin(a)*(ry+17)).toFixed(1),1.5); }
  // textes
  const txt = `
  <text class="t" x="200" y="300" text-anchor="middle" font-family="Pinyon Script, cursive" font-size="30" fill="#A95466">joyeux anniversaire</text>
  <text class="t t2" x="200" y="388" text-anchor="middle" font-family="Bodoni Moda, Didot, serif" font-size="74" fill="#37503F">${CONFIG.name}</text>
  <line class="t t3" x1="170" y1="416" x2="230" y2="416" stroke="#C9A07E" stroke-width="1"/>
  <text class="t t3" x="200" y="444" text-anchor="middle" font-family="Bodoni Moda, serif" font-size="11.5" letter-spacing="3.6" fill="#8E7F82">SAMEDI 3 OCTOBRE 2026</text>
  <text class="t t4" x="200" y="474" text-anchor="middle" font-family="Cormorant Garamond, serif" font-style="italic" font-size="18" fill="#4A4446">tu es invitée à dîner</text>`;
  return DEFS + `<g filter="url(#emb)">${g}</g>` + txt;
}
const heroEl = document.getElementById("heroSvg");
heroEl.insertAdjacentHTML("beforeend", heroSVG());

(function(){
  const r = rng(99); let g=""; const cx=150, cy=185, rx=118, ry=148;
  g += `<ellipse cx="${cx}" cy="${cy}" rx="${rx-10}" ry="${ry-10}" fill="none" stroke="url(#gGold)" stroke-width="2"/>`;
  g += `<ellipse cx="${cx}" cy="${cy}" rx="${rx-4}" ry="${ry-4}" fill="none" stroke="#E8C9CF" stroke-width="1"/>`;
  for (let i=0;i<34;i++){ const a=i/34*Math.PI*2, x=cx+Math.cos(a)*rx, y=cy+Math.sin(a)*ry; const deg=a*180/Math.PI+90;
    g += (i%2? ivy(x,y,.9,deg) : leaf(x,y,14,deg+(r()>.5?20:-20))); }
  const flowers = [[-Math.PI/2,2.2,true],[Math.PI/2,2.2,true],[-Math.PI/2-.5,1.3,false],[-Math.PI/2+.5,1.3,false],[Math.PI/2-.5,1.3,false],[Math.PI/2+.5,1.3,false],[0,1.2,false],[Math.PI,1.2,false]];
  for (const [a,s,w] of flowers) g += rose(cx+Math.cos(a)*rx, cy+Math.sin(a)*ry, s, r()*60, w);
  g += hydrangea(cx-60,cy+ry-14,14,r) + hydrangea(cx+60,cy-ry+14,14,r);
  for (let i=0;i<24;i++){ const a=i/24*Math.PI*2+.13; g += pearl((cx+Math.cos(a)*(rx-16)).toFixed(1),(cy+Math.sin(a)*(ry-16)).toFixed(1),1.2); }
  document.getElementById("cameoFrame").innerHTML = DEFS + `<g filter="url(#emb)">${g}</g>`;
})();

  g += `<path d="M180,160 L180,155" stroke="#6b5a50" stroke-width="1"/>`;
  // verres
  const glass = (x,wine) => `<path d="M${x-10},150 C${x-11},168 ${x-6},178 ${x},179 C${x+6},178 ${x+11},168 ${x+10},150Z" fill="rgba(255,255,255,.55)" stroke="#CDBDBF" stroke-width=".8"/>
    <path d="M${x-9.4},162 C${x-8.5},172 ${x-5},177.5 ${x},178 C${x+5},177.5 ${x+8.5},172 ${x+9.4},162Z" fill="${wine}" opacity=".85"/>
    <path d="M${x},179 L${x},200 M${x-8},201 L${x+8},201" stroke="#CDBDBF" stroke-width="1"/>
    <path d="M${x-6},153 C${x-7},160 ${x-6},166 ${x-4},170" stroke="#fff" stroke-width="1" fill="none"/>`;
  g += glass(132,"#8E2B43") + glass(228,"#8E2B43");
  // petit vase
  g += `<path d="M154,202 C150,196 151,186 156,182 L162,182 C167,186 168,196 164,202Z" fill="#FFFFFF" stroke="#D9C4C4" stroke-width=".7"/>`;
  g += `<path d="M159,182 C158,172 156,166 152,160 M159,182 C161,172 164,168 168,164" fill="none" stroke="${C.vine}" stroke-width=".9"/>`;
  g += rose(152,158,1,20,false) + rose(168,162,.9,-10,true) + leaf(158,172,9,200);
  const body = DEFS + `<g filter="url(#emb)">${g}</g>
   <radialGradient id="gFlame" cx=".5" cy=".7" r=".6"><stop offset="0" stop-color="#FFF4C8"/><stop offset=".6" stop-color="#F6C56A"/><stop offset="1" stop-color="#E59A4B"/></radialGradient>
   <radialGradient id="gGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#FFE3A8" stop-opacity=".75"/><stop offset="1" stop-color="#FFE3A8" stop-opacity="0"/></radialGradient>
   <circle class="glow" cx="180" cy="148" r="34" fill="url(#gGlow)"/>
   <path class="flame" d="M180,138 C184,145 185,150 180,155 C175,150 176,145 180,138Z" fill="url(#gFlame)"/>`;
  document.getElementById("sceneSvg").innerHTML = body;
})();

/* ---------- programme ---------- */
const ICONS = {
  car:`<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"><path d="M6,22 L8,15 C8.6,13.3 10,12.5 11.6,12.5 L24.4,12.5 C26,12.5 27.4,13.3 28,15 L30,22"/><path d="M5,22 H31 V27 H5Z"/><circle cx="11" cy="27" r="2.6"/><circle cx="25" cy="27" r="2.6"/><path d="M10,17 H26"/></svg>`,
  glass:`<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"><path d="M9,7 C8.5,14 10,17 13,17.5 C16,17 17.5,14 17,7Z"/><path d="M13,17.5 V27 M9.5,27.5 H16.5"/><path d="M19,7 C18.5,14 20,17 23,17.5 C26,17 27.5,14 27,7Z"/><path d="M23,17.5 V27 M19.5,27.5 H26.5"/><path d="M9.2,11 H16.8 M19.2,11 H26.8"/></svg>`,
  sparkle:`<svg viewBox="0 0 36 36" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"><path d="M18,5 C19,13 21,16 29,18 C21,20 19,23 18,31 C17,23 15,20 7,18 C15,16 17,13 18,5Z"/><path d="M28,6 C28.4,8.5 29,9.2 31,9.6 C29,10 28.4,10.7 28,13 C27.6,10.7 27,10 25,9.6 C27,9.2 27.6,8.5 28,6Z"/></svg>`,
};
document.getElementById("timeline").innerHTML = CONFIG.timeline.map(i =>
  `<li>${ICONS[i.icon]||ICONS.sparkle}<span class="time">${i.time}</span><span class="what">${i.what}${i.sub?`<small>${i.sub}</small>`:""}</span></li>`).join("");

/* ---------- ouverture ---------- */
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
const gate = document.getElementById("gate");
let opened = false;
function openGate(){
  if (opened) return; opened = true;
  gate.classList.add("open");
  setTimeout(() => document.getElementById("book").classList.add("revealed"), reduce?0:1100);
  setTimeout(() => document.body.classList.remove("locked"), reduce?0:1600);
  setTimeout(() => gate.remove(), reduce?50:2000);
}
document.getElementById("sealBtn").addEventListener("click", openGate);
gate.addEventListener("click", e => { if (e.target.closest(".door")) openGate(); });

/* ---------- médaillon à gratter ---------- */
const canvas = document.getElementById("scratch"), hint = document.getElementById("scratchHint");
let scratchReady=false, revealed=false;
function paintCover(ctx,w,h){
  const g=ctx.createLinearGradient(0,0,w,h); g.addColorStop(0,"#F9E6EA"); g.addColorStop(.5,"#F2D3DA"); g.addColorStop(1,"#F8E3E7");
  ctx.fillStyle=g; ctx.fillRect(0,0,w,h);
  const img=ctx.getImageData(0,0,w,h), d=img.data;
  for(let i=0;i<d.length;i+=4){ const n=(Math.random()-.5)*12; d[i]+=n; d[i+1]+=n; d[i+2]+=n; }
  ctx.putImageData(img,0,0);
  const r = rng(3);
  for(let k=0;k<40;k++){ const x=r()*w, y=r()*h, s=(4+r()*6)*(w/220);
    for(let p=0;p<5;p++){ const a=p/5*Math.PI*2+r();
      ctx.beginPath(); ctx.ellipse(x+Math.cos(a)*s,y+Math.sin(a)*s,s*.65,s*.38,a,0,Math.PI*2);
      ctx.strokeStyle="rgba(255,255,255,.9)"; ctx.lineWidth=1; ctx.stroke();
      ctx.beginPath(); ctx.ellipse(x+Math.cos(a)*s+1,y+Math.sin(a)*s+1,s*.65,s*.38,a,0,Math.PI*2);
      ctx.strokeStyle="rgba(150,70,90,.12)"; ctx.stroke(); }
  }
  ctx.fillStyle="rgba(169,84,102,.55)"; ctx.textAlign="center"; ctx.textBaseline="middle";
  ctx.font=`${Math.round(w/7)}px "Pinyon Script", cursive`; ctx.fillText("gratte-moi", w/2, h/2);
}
function setupScratch(){
  if(scratchReady) return; scratchReady=true;
  const dpr=Math.min(devicePixelRatio||1,2), rect=canvas.getBoundingClientRect();
  canvas.width=Math.round(rect.width*dpr); canvas.height=Math.round(rect.height*dpr);
  const ctx=canvas.getContext("2d",{willReadFrequently:true}); paintCover(ctx,canvas.width,canvas.height);
  let drawing=false,last=null,n=0; const R=22*dpr;
  const pos=e=>{const b=canvas.getBoundingClientRect();return{x:(e.clientX-b.left)*dpr,y:(e.clientY-b.top)*dpr}};
  function draw(p){ ctx.globalCompositeOperation="destination-out"; ctx.lineCap="round"; ctx.lineWidth=R*2; ctx.beginPath();
    if(last){ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();} else {ctx.arc(p.x,p.y,R,0,Math.PI*2);ctx.fill();}
    last=p; if(++n%8===0) check(); }
  function check(){ const d=ctx.getImageData(0,0,canvas.width,canvas.height).data; let c=0,t=0;
    for(let i=3;i<d.length;i+=64){t++; if(d[i]<40)c++;} if(c/t>.5) reveal(); }
  function reveal(){ if(revealed) return; revealed=true; canvas.classList.add("done"); hint.style.opacity=0;
    setTimeout(()=>{hint.textContent="Toi et moi. Et bientôt, ton dîner d'anniversaire."; hint.style.opacity=1;},500);
    burst(24); }
  canvas.addEventListener("pointerdown",e=>{drawing=true;last=null;canvas.setPointerCapture(e.pointerId);draw(pos(e));});
  canvas.addEventListener("pointermove",e=>{if(drawing)draw(pos(e));});
  const stop=()=>{drawing=false;last=null;check();};
  canvas.addEventListener("pointerup",stop); canvas.addEventListener("pointercancel",stop);
  canvas.tabIndex=0; canvas.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();reveal();}});
}
if (document.fonts && document.fonts.load) { document.fonts.load('40px "Pinyon Script"').finally(setupScratch); } else setupScratch();
addEventListener("load", setupScratch);

/* ---------- compte à rebours ---------- */
const target = new Date(CONFIG.eventISO).getTime(); const $=id=>document.getElementById(id);
(function tick(){ const diff=Math.max(0,target-Date.now());
  if(!diff){ $("cdWrap").innerHTML='<p class="countdown-done">C\'est ce soir. Joyeux anniversaire.</p>'; return; }
  const s=Math.floor(diff/1000); $("cd-d").textContent=Math.floor(s/86400); $("cd-h").textContent=Math.floor(s%86400/3600);
  $("cd-m").textContent=Math.floor(s%3600/60); $("cd-s").textContent=s%60; setTimeout(tick,1000-Date.now()%1000); })();

/* ---------- pluie de pétales ---------- */
const pc=$("petals"), px=pc.getContext("2d"); let petals=[], raf=null;
function sizePetals(){ const d=Math.min(devicePixelRatio||1,2); pc.width=innerWidth*d; pc.height=innerHeight*d; px.setTransform(d,0,0,d,0,0); }
sizePetals(); addEventListener("resize",sizePetals);
function burst(count){
  if(reduce) return;
  const cols=["#F4C3CD","#EDB0BD","#FBE1E6","#FFFFFF","#E39AAB"];
  for(let i=0;i<count;i++) petals.push({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,s:5+Math.random()*7,
    vy:.8+Math.random()*1.4,vx:(Math.random()-.5)*.6,a:Math.random()*6,va:(Math.random()-.5)*.08,w:Math.random()*6,c:cols[i%cols.length]});
  if(!raf) loop();
}
function loop(){
  px.clearRect(0,0,innerWidth,innerHeight);
  petals=petals.filter(p=>p.y<innerHeight+30);
  for(const p of petals){ p.w+=.03; p.x+=p.vx+Math.sin(p.w)*.6; p.y+=p.vy; p.a+=p.va;
    px.save(); px.translate(p.x,p.y); px.rotate(p.a); px.scale(1,Math.abs(Math.cos(p.w))*.6+.4);
    px.beginPath(); px.moveTo(0,-p.s); px.bezierCurveTo(p.s*.9,-p.s*.6,p.s*.7,p.s*.7,0,p.s); px.bezierCurveTo(-p.s*.7,p.s*.7,-p.s*.9,-p.s*.6,0,-p.s);
    px.fillStyle=p.c; px.globalAlpha=.9; px.fill(); px.strokeStyle="rgba(200,120,140,.35)"; px.lineWidth=.6; px.stroke(); px.restore(); }
  raf = petals.length ? requestAnimationFrame(loop) : (px.clearRect(0,0,innerWidth,innerHeight), null);
}

try{ if(localStorage.getItem("milla-accepted")==="1") rsvp.classList.add("is-accepted"); }catch(e){}
$("rsvpBtn").addEventListener("click",()=>{ rsvp.classList.add("is-accepted"); burst(90);
  try{localStorage.setItem("milla-accepted","1");}catch(e){} });
</script>
